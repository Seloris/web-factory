<app-field class="raid" [label]="'rosterBuilder.toolbar.raid' | translate">
  <app-select>
    <select appControl [value]="raidId()" [disabled]="isPending()" (change)="onRaid($event)">
      @for (raid of raids(); track raid.id) {
        <option [value]="raid.id">{{ raid.name }}</option>
      }
    </select>
  </app-select>
</app-field>

<app-field [label]="'rosterBuilder.toolbar.tanks' | translate">
  <div class="step">
    <button appButton [disabled]="!canStep(-1, 0)" [attr.aria-label]="'rosterBuilder.toolbar.fewerTanks' | translate" (click)="step(-1, 0)">−</button>
    <input appControl readonly [value]="tanks()" />
    <button appButton [disabled]="!canStep(1, 0)" [attr.aria-label]="'rosterBuilder.toolbar.moreTanks' | translate" (click)="step(1, 0)">+</button>
  </div>
</app-field>

<app-field [label]="'rosterBuilder.toolbar.heals' | translate">
  <div class="step">
    <button appButton [disabled]="!canStep(0, -1)" [attr.aria-label]="'rosterBuilder.toolbar.fewerHeals' | translate" (click)="step(0, -1)">−</button>
    <input appControl readonly [value]="heals()" />
    <button appButton [disabled]="!canStep(0, 1)" [attr.aria-label]="'rosterBuilder.toolbar.moreHeals' | translate" (click)="step(0, 1)">+</button>
  </div>
</app-field>

<div class="dps">
  <span class="label" id="toolbar-dps">{{ 'rosterBuilder.toolbar.dps' | translate }}</span>
  <output aria-labelledby="toolbar-dps">{{ dps() }}</output>
</div>

<div class="actions">
  @if (isGenerated()) {
    <span class="hint"><app-icon name="lock" />{{ lockedKey() | translate: { count: lockedCount() } }}</span>
    <button appButton [disabled]="isPending() || lockedCount() === 0" (click)="unlockAll.emit()">
      <app-icon name="unlock" />{{ 'rosterBuilder.toolbar.unlockAll' | translate }}
    </button>
  }
  <button appButton variant="primary" [disabled]="isPending() || !canGenerate()" (click)="generate.emit()">
    <app-icon name="shuffle" />{{ (isGenerated() ? 'rosterBuilder.toolbar.reshuffle' : 'rosterBuilder.toolbar.generate') | translate }}
  </button>
</div>
